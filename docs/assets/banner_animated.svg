<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020a16" />
      <stop offset="50%" stop-color="#071d33" />
      <stop offset="100%" stop-color="#030f20" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tech Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00f5d4" stroke-width="0.5" opacity="0.07" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseRing {
        0% { r: 50px; opacity: 0.5; }
        50% { r: 130px; opacity: 0.15; }
        100% { r: 210px; opacity: 0; }
      }
      @keyframes floatBubble {
        0% { transform: translateY(0px) translateX(0px); opacity: 0; }
        15% { opacity: 0.75; }
        85% { opacity: 0.65; }
        100% { transform: translateY(-350px) translateX(20px); opacity: 0; }
      }
      @keyframes waveSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-600px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes titleShine {
        0%, 100% { fill: #f0fdf4; filter: drop-shadow(0 0 8px rgba(0,245,212,0.4)); }
        50% { fill: #00f5d4; filter: drop-shadow(0 0 18px rgba(0,245,212,0.9)); }
      }
      .bubble-1 { animation: floatBubble 7s infinite linear; }
      .bubble-2 { animation: floatBubble 9s infinite 1.5s linear; }
      .bubble-3 { animation: floatBubble 6s infinite 3s linear; }
      .bubble-4 { animation: floatBubble 8.5s infinite 4.2s linear; }
      .bubble-5 { animation: floatBubble 10.5s infinite 2.2s linear; }
      .bubble-6 { animation: floatBubble 7.5s infinite 5s linear; }
      .bubble-7 { animation: floatBubble 9.5s infinite 0.7s linear; }
      .wave-anim-1 { animation: waveSlide 18s infinite linear; }
      .wave-anim-2 { animation: waveSlide 24s infinite reverse linear; }
      .sonar-pulse { animation: pulseRing 4.5s infinite cubic-bezier(0.2, 0.8, 0.4, 1); }
      .glow-pulse { animation: pulseGlow 2.8s infinite ease-in-out; }
      .title-animated { animation: titleShine 5s infinite ease-in-out; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Deep Ocean Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="340" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Sonar Wave Radar Circles in Background -->
  <g transform="translate(600, 170)" pointer-events="none">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.14" />
    <circle cx="0" cy="0" r="150" fill="none" stroke="#00f5d4" stroke-width="0.8" opacity="0.09" />
    <circle cx="0" cy="0" r="240" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.05" />
    <circle cx="0" cy="0" class="sonar-pulse" fill="none" stroke="#00f5d4" stroke-width="1.8" />
  </g>

  <!-- Floating Particles & Marine Bubbles -->
  <g pointer-events="none">
    <g class="bubble-1" transform="translate(160, 340)"><circle cx="0" cy="0" r="4.5" fill="#38bdf8" opacity="0.5" /><circle cx="-1.2" cy="-1.2" r="1.5" fill="#ffffff" opacity="0.85" /></g>
    <g class="bubble-2" transform="translate(320, 340)"><circle cx="0" cy="0" r="6.5" fill="#00f5d4" opacity="0.4" /><circle cx="-1.8" cy="-1.8" r="2" fill="#ffffff" opacity="0.85" /></g>
    <g class="bubble-3" transform="translate(490, 340)"><circle cx="0" cy="0" r="4" fill="#38bdf8" opacity="0.6" /><circle cx="-1" cy="-1" r="1.2" fill="#ffffff" opacity="0.85" /></g>
    <g class="bubble-4" transform="translate(680, 340)"><circle cx="0" cy="0" r="7.5" fill="#00f5d4" opacity="0.4" /><circle cx="-2" cy="-2" r="2.3" fill="#ffffff" opacity="0.85" /></g>
    <g class="bubble-5" transform="translate(850, 340)"><circle cx="0" cy="0" r="5.5" fill="#38bdf8" opacity="0.5" /><circle cx="-1.5" cy="-1.5" r="1.7" fill="#ffffff" opacity="0.85" /></g>
    <g class="bubble-6" transform="translate(1010, 340)"><circle cx="0" cy="0" r="5" fill="#00f5d4" opacity="0.5" /><circle cx="-1.2" cy="-1.2" r="1.5" fill="#ffffff" opacity="0.85" /></g>
    <g class="bubble-7" transform="translate(1130, 340)"><circle cx="0" cy="0" r="3.8" fill="#38bdf8" opacity="0.5" /><circle cx="-1" cy="-1" r="1.1" fill="#ffffff" opacity="0.85" /></g>
  </g>

  <!-- Undulating Fluid Waves at Bottom -->
  <g opacity="0.22" class="wave-anim-1">
    <path d="M 0 310 C 150 290, 300 330, 450 310 C 600 290, 750 330, 900 310 C 1050 290, 1200 330, 1350 310 C 1500 290, 1650 330, 1800 310 L 1800 340 L 0 340 Z" fill="#00f5d4" />
  </g>
  <g opacity="0.14" class="wave-anim-2">
    <path d="M 0 318 C 150 332, 300 305, 450 320 C 600 335, 750 305, 900 320 C 1050 335, 1200 305, 1350 320 C 1500 335, 1650 305, 1800 320 L 1800 340 L 0 340 Z" fill="#38bdf8" />
  </g>

  <!-- Futuristic Corner Frame Accents -->
  <g stroke="#00f5d4" stroke-width="2" fill="none" opacity="0.75">
    <!-- Top-Left -->
    <path d="M 22 48 L 22 22 L 48 22" />
    <circle cx="22" cy="22" r="2.5" fill="#00f5d4" />
    <!-- Top-Right -->
    <path d="M 1152 22 L 1178 22 L 1178 48" />
    <circle cx="1178" cy="22" r="2.5" fill="#00f5d4" />
    <!-- Bottom-Left -->
    <path d="M 22 292 L 22 318 L 48 318" />
    <circle cx="22" cy="318" r="2.5" fill="#00f5d4" />
    <!-- Bottom-Right -->
    <path d="M 1152 318 L 1178 318 L 1178 292" />
    <circle cx="1178" cy="318" r="2.5" fill="#00f5d4" />
  </g>

  <!-- Top Institutional Pill Badge -->
  <g transform="translate(600, 48)">
    <rect x="-290" y="-16" width="580" height="32" rx="16" fill="#06182a" stroke="#00f5d4" stroke-width="1.2" opacity="0.92" />
    <circle cx="-270" cy="0" r="4" fill="#ffd166" class="glow-pulse" />
    <text x="0" y="4.5" font-family="'Segoe UI', 'Consolas', sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">
      UNIVERSITAS BANGKA BELITUNG • FAKULTAS SAINS &amp; TEKNIK • TEKNIK ELEKTRO
    </text>
    <circle cx="270" cy="0" r="4" fill="#ffd166" class="glow-pulse" />
  </g>

  <!-- Main Title: AUV SAUVAC -->
  <g transform="translate(600, 142)">
    <text x="0" y="0" font-family="'Segoe UI', 'Bahnschrift', 'Arial Black', sans-serif" font-size="64" font-weight="900" letter-spacing="12" class="title-animated" text-anchor="middle">
      AUV SAUVAC
    </text>
  </g>

  <!-- Subtitle: Autonomous Underwater Vehicle -->
  <g transform="translate(600, 186)">
    <text x="0" y="0" font-family="'Segoe UI', 'Consolas', sans-serif" font-size="15" font-weight="800" letter-spacing="6" fill="#ffd166" text-anchor="middle" filter="url(#softGlow)">
      AUTONOMOUS UNDERWATER VEHICLE
    </text>
  </g>

  <!-- Target Event Badge -->
  <g transform="translate(600, 222)">
    <text x="0" y="0" font-family="'Segoe UI', 'Consolas', sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#94a3b8" text-anchor="middle">
      SINGAPORE AUV CHALLENGE (SAUVC) 2027 QUALIFICATION
    </text>
  </g>

  <!-- Feature Chips Bar along Bottom -->
  <g transform="translate(600, 276)">
    <!-- Chip 1: RP2040 Dual-Core -->
    <g transform="translate(-440, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#082038" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="4" font-family="'Segoe UI', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ RP2040 DUAL-CORE</text>
    </g>
    <!-- Chip 2: 6-DOF Vector Thruster -->
    <g transform="translate(-220, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#082038" stroke="#00f5d4" stroke-width="1" />
      <text x="0" y="4" font-family="'Segoe UI', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#00f5d4" text-anchor="middle">🧭 6-DOF V6 MATRIX</text>
    </g>
    <!-- Chip 3: Wireless Web Terminal & OTA -->
    <g transform="translate(0, 0)">
      <rect x="-84" y="-14" width="168" height="28" rx="14" fill="#082038" stroke="#ffd166" stroke-width="1" />
      <text x="0" y="4" font-family="'Segoe UI', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#ffd166" text-anchor="middle">📡 WEB TERMINAL &amp; OTA</text>
    </g>
    <!-- Chip 4: MS5803 & IMU Sensor -->
    <g transform="translate(220, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#082038" stroke="#00f5d4" stroke-width="1" />
      <text x="0" y="4" font-family="'Segoe UI', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#00f5d4" text-anchor="middle">🎯 PID DEPTH &amp; YAW</text>
    </g>
    <!-- Chip 5: Hardware Kill Switch -->
    <g transform="translate(440, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#082038" stroke="#ef4444" stroke-width="1" />
      <text x="0" y="4" font-family="'Segoe UI', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#fca5a5" text-anchor="middle">🛡️ FAILSAFE &amp; KILL-SW</text>
    </g>
  </g>

  <!-- Border line with neon cyan glow -->
  <rect x="1" y="1" width="1198" height="338" rx="16" fill="none" stroke="#00f5d4" stroke-width="1.5" opacity="0.5" />
</svg>